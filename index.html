<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Comment Feed — Zone4 / TOSM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b34;
    --text: #e6e8eb;
    --muted: #8b95a1;
    --zone4: #38bdf8;
    --tosm: #f97316;
    --accent: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Thai', 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  .filters {
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
  }
  .filter-btn.active { color: var(--text); border-color: var(--text); }
  #feed {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .comment {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .comment-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .from { font-weight: 600; font-size: 14px; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag.zone4 { background: rgba(56,189,248,0.15); color: var(--zone4); }
  .tag.tosm { background: rgba(249,115,22,0.15); color: var(--tosm); }
  .message {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .meta {
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 13px;
  }
  .new-badge {
    display: inline-block;
    font-size: 9px;
    background: var(--accent);
    color: #0f1115;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <h1>FB Comment Feed — Zone4 / TOSM 2026</h1>
  <div class="status"><span class="dot"></span><span id="statusText">กำลังเชื่อมต่อ...</span></div>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
  <button class="filter-btn" data-filter="Zone4">Zone4</button>
  <button class="filter-btn" data-filter="TOSM 2026">TOSM 2026</button>
</div>

<div id="feed"><div class="empty">กำลังโหลดคอมเมนต์...</div></div>

<script>
  // ===== แก้ 2 ค่านี้ก่อน deploy =====
  const SUPABASE_URL = 'https://jbklakekfqfvihhjyyvg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impia2xha2VrZnFmdmloaGp5eXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODkxNTEsImV4cCI6MjEwMzQ2NTE1MX0.hbGO8yllzkduiM_SzEWV4d-ve6yI5i2PzhlYzGvov54'; // Project Settings > API > anon public
  // ===================================

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentFilter = 'all';
  let allComments = [];

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  function tagClass(pageName) {
    return pageName === 'Zone4' ? 'zone4' : 'tosm';
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'เมื่อสักครู่';
    if (mins < 60) return mins + ' นาทีที่แล้ว';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + ' ชม.ที่แล้ว';
    return Math.floor(hrs / 24) + ' วันที่แล้ว';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function render() {
    const feed = document.getElementById('feed');
    const filtered = currentFilter === 'all'
      ? allComments
      : allComments.filter(c => c.page_name === currentFilter);

    if (filtered.length === 0) {
      feed.innerHTML = '<div class="empty">ยังไม่มีคอมเมนต์</div>';
      return;
    }

    feed.innerHTML = filtered.map(c => `
      <div class="comment">
        <div class="comment-top">
          <span class="from">${escapeHtml(c.from_name)}</span>
          <span class="tag ${tagClass(c.page_name)}">${escapeHtml(c.page_name)}</span>
        </div>
        <div class="message">${escapeHtml(c.message)}</div>
        <div class="meta">${timeAgo(c.created_time)}</div>
      </div>
    `).join('');
  }

  async function loadInitial() {
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .order('created_time', { ascending: false })
      .limit(100);

    if (error) {
      document.getElementById('statusText').textContent = 'โหลดข้อมูลไม่สำเร็จ';
      console.error(error);
      return;
    }

    allComments = data || [];
    render();
    document.getElementById('statusText').textContent = 'เชื่อมต่อสำเร็จ — รอคอมเมนต์ใหม่แบบเรียลไทม์';
  }

  function subscribeRealtime() {
    supabaseClient
      .channel('comments-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
        allComments.unshift(payload.new);
        if (allComments.length > 200) allComments.pop();
        render();
        document.getElementById('statusText').textContent =
          'คอมเมนต์ใหม่ ' + new Date().toLocaleTimeString('th-TH');
      })
      .subscribe();
  }

  loadInitial();
  subscribeRealtime();
</script>

</body>
</html>
