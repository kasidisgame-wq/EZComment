<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Comment Feed — Zone4 / TOSM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-hover: #1c2129;
    --border: #262b34;
    --text: #e6e8eb;
    --muted: #8b95a1;
    --zone4: #38bdf8;
    --tosm: #f97316;
    --accent: #22c55e;
  }
  html.light {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-hover: #f0f1f3;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Prompt', 'IBM Plex Mono', sans-serif;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.3px;
    margin: 0;
    font-weight: 600;
  }
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    font-family: 'Prompt', sans-serif;
    font-weight: 500;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-color: var(--text); background: var(--panel-hover); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  .theme-toggle {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    align-items: flex-start;
  }
  aside {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    height: calc(100vh - 65px);
    overflow-y: auto;
    position: sticky;
    top: 65px;
    padding: 12px;
  }
  .sidebar-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    padding: 8px 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .post-item {
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .post-item:hover { background: var(--panel-hover); }
  .post-item.active { background: var(--panel-hover); border-color: var(--border); }
  .post-item .post-snippet {
    font-size: 13px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .post-item .post-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .post-tag {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .post-tag.zone4 { background: rgba(56,189,248,0.15); color: var(--zone4); }
  .post-tag.tosm { background: rgba(249,115,22,0.15); color: var(--tosm); }
  main {
    flex: 1;
    padding: 20px 20px 60px;
    min-width: 0;
  }
  .active-filter-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .active-filter-bar.show { display: flex; }
  .active-filter-bar a { color: var(--zone4); text-decoration: none; }
  .clear-filter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    background: transparent;
  }
  .comment {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .comment-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .who { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600;
    color: #0f1115;
    flex-shrink: 0;
  }
  .avatar.generic { background: var(--border); color: var(--muted); }
  .from { font-weight: 600; font-size: 14px; }
  .from.anonymous { color: var(--muted); font-weight: 500; font-style: italic; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag.zone4 { background: rgba(56,189,248,0.15); color: var(--zone4); }
  .tag.tosm { background: rgba(249,115,22,0.15); color: var(--tosm); }
  .message {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .meta {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .meta a {
    color: var(--muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .meta a:hover { color: var(--text); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 13px;
  }
  @media (max-width: 800px) {
    aside { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>FB Comment Feed</h1>
    <div class="tabs" id="pageTabs">
      <button class="tab-btn active" data-page="all">ทั้งหมด</button>
      <button class="tab-btn" data-page="Zone4">Zone4</button>
      <button class="tab-btn" data-page="TOSM 2026">TOSM 2026</button>
    </div>
  </div>
  <div class="header-right">
    <div class="status"><span class="dot"></span><span id="statusText">กำลังเชื่อมต่อ...</span></div>
    <button class="theme-toggle" id="themeToggle" title="สลับธีม">🌙</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-title">โพสต์ที่มีคอมเมนต์</div>
    <div id="postList"></div>
  </aside>
  <main>
    <div class="active-filter-bar" id="activeFilterBar">
      <span id="activeFilterText"></span>
      <button class="clear-filter" id="clearFilterBtn">ล้างตัวกรอง ✕</button>
    </div>
    <div id="feed"><div class="empty">กำลังโหลดคอมเมนต์...</div></div>
  </main>
</div>

<script>
  // ===== แก้ 2 ค่านี้ก่อน deploy =====
  const SUPABASE_URL = 'https://jbklakekfqfvihhjyyvg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impia2xha2VrZnFmdmloaGp5eXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODkxNTEsImV4cCI6MjEwMzQ2NTE1MX0.hbGO8yllzkduiM_SzEWV4d-ve6yI5i2PzhlYzGvov54';
  // ===================================

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allComments = [];
  let currentPage = 'all';      // 'all' | 'Zone4' | 'TOSM 2026'
  let currentPostId = null;     // null = no post filter

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.classList.toggle('light', theme === 'light');
    document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
    localStorage.setItem('fbfeed-theme', theme);
  }
  const savedTheme = localStorage.getItem('fbfeed-theme') || 'dark';
  applyTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });

  // ---------- Tabs ----------
  document.getElementById('pageTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    currentPostId = null; // switching page tabs clears post filter
    renderSidebar();
    renderFeed();
  });

  document.getElementById('clearFilterBtn').addEventListener('click', () => {
    currentPostId = null;
    renderSidebar();
    renderFeed();
  });

  // ---------- Helpers ----------
  function tagClass(pageName) { return pageName === 'Zone4' ? 'zone4' : 'tosm'; }

  function timeAgo(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'เมื่อสักครู่';
    if (mins < 60) return mins + ' นาทีที่แล้ว';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + ' ชม.ที่แล้ว';
    return Math.floor(hrs / 24) + ' วันที่แล้ว';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  const AVATAR_COLORS = ['#38bdf8', '#f97316', '#a78bfa', '#34d399', '#f472b6', '#facc15', '#fb7185', '#60a5fa'];
  function colorForName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }
  function isAnonymous(name) { return !name || name === 'Unknown'; }
  function renderAvatar(name) {
    if (isAnonymous(name)) {
      return `<div class="avatar generic">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </div>`;
    }
    const initial = name.trim().charAt(0).toUpperCase();
    return `<div class="avatar" style="background:${colorForName(name)}">${escapeHtml(initial)}</div>`;
  }
  function displayName(name) { return isAnonymous(name) ? 'ผู้ใช้ Facebook' : name; }

  // ---------- Derive post list from comments ----------
  function getPostsForCurrentPage() {
    const posts = {};
    allComments.forEach(c => {
      if (currentPage !== 'all' && c.page_name !== currentPage) return;
      if (!posts[c.post_id]) {
        posts[c.post_id] = {
          post_id: c.post_id,
          page_name: c.page_name,
          post_message: c.post_message,
          post_permalink: c.post_permalink,
          count: 0,
          latest: c.created_time,
        };
      }
      posts[c.post_id].count++;
      if (c.created_time > posts[c.post_id].latest) posts[c.post_id].latest = c.created_time;
    });
    return Object.values(posts).sort((a, b) => (b.latest || '').localeCompare(a.latest || ''));
  }

  function renderSidebar() {
    const posts = getPostsForCurrentPage();
    const list = document.getElementById('postList');
    if (posts.length === 0) {
      list.innerHTML = '<div class="empty" style="padding:20px 8px;">ยังไม่มีโพสต์</div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="post-item ${currentPostId === p.post_id ? 'active' : ''}" data-post-id="${escapeHtml(p.post_id)}">
        <div class="post-snippet">${escapeHtml(p.post_message || '(โพสต์ไม่มีข้อความ)')}</div>
        <div class="post-meta">
          <span class="post-tag ${tagClass(p.page_name)}">${escapeHtml(p.page_name)}</span>
          <span>${p.count} คอมเมนต์</span>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('postList').addEventListener('click', (e) => {
    const item = e.target.closest('.post-item');
    if (!item) return;
    const postId = item.dataset.postId;
    currentPostId = (currentPostId === postId) ? null : postId;
    // keep page tab in sync with the post's page
    if (currentPostId) {
      const post = allComments.find(c => c.post_id === currentPostId);
      if (post) {
        currentPage = post.page_name;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
      }
    }
    renderSidebar();
    renderFeed();
  });

  // ---------- Feed ----------
  function renderFeed() {
    let filtered = allComments;
    if (currentPage !== 'all') filtered = filtered.filter(c => c.page_name === currentPage);
    if (currentPostId) filtered = filtered.filter(c => c.post_id === currentPostId);

    const bar = document.getElementById('activeFilterBar');
    if (currentPostId) {
      const post = filtered[0];
      document.getElementById('activeFilterText').innerHTML =
        '📌 กำลังดูคอมเมนต์เฉพาะโพสต์: "' + escapeHtml((post && post.post_message || '').substring(0, 60)) + '..."';
      bar.classList.add('show');
    } else {
      bar.classList.remove('show');
    }

    const feed = document.getElementById('feed');
    if (filtered.length === 0) {
      feed.innerHTML = '<div class="empty">ยังไม่มีคอมเมนต์</div>';
      return;
    }

    feed.innerHTML = filtered.map(c => `
      <div class="comment">
        <div class="comment-top">
          <div class="who">
            ${renderAvatar(c.from_name)}
            <span class="from ${isAnonymous(c.from_name) ? 'anonymous' : ''}">${escapeHtml(displayName(c.from_name))}</span>
          </div>
          <span class="tag ${tagClass(c.page_name)}">${escapeHtml(c.page_name)}</span>
        </div>
        <div class="message">${escapeHtml(c.message)}</div>
        <div class="meta">
          <span>${timeAgo(c.created_time)}</span>
          ${(c.comment_permalink || c.post_permalink) ? `<a href="${escapeHtml(c.comment_permalink || c.post_permalink)}" target="_blank" rel="noopener">ดูบน Facebook ↗</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  // ---------- Data loading ----------
  async function loadInitial() {
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .order('created_time', { ascending: false })
      .limit(300);

    if (error) {
      document.getElementById('statusText').textContent = 'โหลดข้อมูลไม่สำเร็จ';
      console.error(error);
      return;
    }

    allComments = data || [];
    renderSidebar();
    renderFeed();
    document.getElementById('statusText').textContent = 'เชื่อมต่อสำเร็จ — รอคอมเมนต์ใหม่แบบเรียลไทม์';
  }

  function subscribeRealtime() {
    supabaseClient
      .channel('comments-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
        allComments.unshift(payload.new);
        if (allComments.length > 400) allComments.pop();
        renderSidebar();
        renderFeed();
        document.getElementById('statusText').textContent =
          'คอมเมนต์ใหม่ ' + new Date().toLocaleTimeString('th-TH');
      })
      .subscribe();
  }

  loadInitial();
  subscribeRealtime();
</script>

</body>
</html>
